[project]
name = "layerflow-api"
version = "1.0.0"
description = "LayerFlow agent engine: API, agents and worker for The Executive Narrative"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "httpx[http2]>=0.28",
  "feedparser>=6.0.11",
  "trafilatura>=2.0",
  "readability-lxml>=0.8.1",
  "lxml-html-clean>=0.4",
  "charset-normalizer>=3.4",
  "argon2-cffi>=23.1",
  "jsonschema>=4.23",
  "pyyaml>=6.0.2",
  "python-dateutil>=2.9",
  "cryptography>=43",
  "jinja2>=3.1.4",
  "paramiko>=3.5",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["app"]
