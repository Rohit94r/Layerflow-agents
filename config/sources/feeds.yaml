# LayerFlow discovery sources — The Executive Narrative (tenant: ten)
#
# Curated platform list, organised by what TEN uses each source for rather than
# by geography alone. Seeded into the `sources` table on bootstrap; editable
# afterwards from Settings → Sources. `python -m app.cli seed-sources --sync`
# refreshes catalog metadata and retires (never deletes) feeds no longer listed.
#
# Fields
#   kind    rss | gdelt | edgar | ir | hn | reddit
#   weight  0.3–1.5 source-quality weight used by the discovery score (plan §5 A1)
#   region  global | us | eu | uk | india | mena | apac | africa | latam
#   group   catalog group shown in Settings → Sources
#   tier    primary_daily | regional | specialist | strategic | validation
#   active  false = kept for reference but not fetched
#
# Coverage notes
#   * Reuters, Bloomberg and most consultancies retired public RSS years ago.
#     Their entries use Google News' keyless, site-scoped RSS (still linking to
#     the publisher's own article); the unwrapper resolves the redirect and the
#     discovery backfill fetches the publisher page for the lead image.
#   * The Gulf Intelligence appears twice in the brief (#33 and #47) and is kept
#     once. Vodafone Qatar and The Gulf Intelligence currently expose no usable
#     keyless news feed, so they ship inactive until a feed is supplied.
#   * Feeds/APIs are published for syndication and fetched as such. Article pages
#     reached from them are fetched only by discovery's bounded image backfill
#     and the research agent, both of which honour robots.txt and rate limits.
#
# Image policy: see apps/api/app/services/images.py. Only real publisher
# photography is accepted — landscape rasters (jpg/jpeg/png/webp/avif), never
# logos, icons, sprites, favicons, placeholders, tracking pixels or svg/gif.

