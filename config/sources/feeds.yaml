# LayerFlow discovery sources — The Executive Narrative (tenant: ten)
#
# Every source here is keyless (plan §2.1 tier A, or tier B where marked).
# Seeded into the `sources` table on bootstrap; editable afterwards from
# Settings → Sources. Sources already present (matched by URL) are left as-is.
#
# Fields
#   kind    rss | gdelt | edgar | ir | hn | reddit
#   weight  0.3–1.5 source-quality weight used by the discovery score (plan §5 A1)
#   region  global | us | eu | uk | india | mena | apac | africa | latam
#   active  false = kept for reference but not fetched
#
# Lines marked `# verify` are feeds whose URL was not confirmed at the time of
# writing. They ship inactive; test them from Settings → Sources → Test and
# switch them on if they return items.
#
# Compliance (plan §10.4): feeds and APIs are published for syndication and are
# fetched as such. Article pages reached from them are fetched only by the
# research agent, which honours robots.txt and rate limits.

